<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order C-max Bakery</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section class="modal-content">
        <img src="images/logo.png" alt="">
        <h2>Place Your Order. C-max Bakery</h2>

        <form id="orderForm">
            <section class="details">
                <h3>Personal Details</h3>
                <p>Please fill in the blank space</p>
                <div>
                    <label>Full Name</label>
                    <input type="text" id="name" placeholder="Enter your Full Name">
                    <label>Phone Number</label>
                    <input type="tel" id="phone" placeholder="Enter your phonenumber" required>
                    <label>Address</label>
                    <input type="text" id="address" placeholder="Address/Location" required>
                    <label>Delivery date</label>
                    <input type="Date" id="date" required>
                </div>
            </section>


            <div class="items-list">
                <div class="single">
                    <p>Single Layer-Cake </p>
                    <label><input type="checkbox" value="25,000" data-name="Custom Cake (6 inches)"> Custom Cake (8 inches) - ₦25,000</label>
                    <label><input type="checkbox" value="₦30,000" data-name="Custom Cake (8 inches)"> Custom Cake (6 inches) - ₦30,000</label>
                    <label><input type="checkbox" value="₦35,000" data-name="Custom cake (10 inches)"> Custom cake (8 inches) - ₦35,000 </label>
                    <label><input type="checkbox" value="₦40,000" data-name="Custom cake(12 inches)"> Custom cake (12 inches) - ₦40,000</label>
                </div>

                <div class="double">
                    <p>Double Layer-Cake</p>
                    <label><input type="checkbox" value="₦45,000" data-name="Custom Cake (6 inches)"> Custom Cake (8 inches) - ₦245,000</label>
                    <label><input type="checkbox" value="₦55,000" data-name="Custom Cake (8 inches)"> Custom Cake (6 inches) - ₦55,000</label>
                    <label><input type="checkbox" value="₦65,000" data-name="Custom cake (10 inches)"> Custom cake (8 inches) - ₦65,000 </label>
                    <label><input type="checkbox" value="₦75,000" data-name="Custom cake(12 inches)"> Custom cake (12 inches) - ₦75,000</label>
                </div>
                <label>Special Instructions / Message</label>
                <textarea id="msg" placeholder="E.g: name on the cake/color..."></textarea>
            </div>

            <div class="zobo">
                <div class="zobo-item" id="zobo35">
                    <input type="checkbox" id="check35" onchange="toggleQty('zobo35', this)">
                    <label for="check35">Zobo 35cl - ₦600</label>
                    <div class="box">
                        <span>Qty:</span>
                        <input type="number" min="1" value="1" placeholder="No. of bottles">
                    </div>

                </div>

                <div class="zobo-item" id="zobo50">
                    <input type="checkbox" id="check50" onchange="toggleQty( 'zobo50', this)">
                    <label for="check50">Zobo 50cl - ₦1200</label>
                    <div class="box">
                        <span>Qty:</span>
                        <input type="number" min="1" value="1" placeholder="No. of bottles">
                    </div>

                </div>
            </div>


            <div class="bouq">
                <p>Money Bouquet
                </p>
                <div class="two">
                    <p><b>200 Naira Notes</b></p>
                    <label><input type="checkbox" value="₦25,000" data-name="200 notes for 10,000">200 notes for 10,000- ₦25,000</label>
                    <label><input type="checkbox" value="₦35,000" data-name="200 notes for 15,000">200 notes for 15,000- ₦35,000</label>
                    <label><input type="checkbox" value="₦45,000" data-name="200 notes for 20,000">200 notes for 20,000- ₦45,000 </label>
                    <label><input type="checkbox" value="₦65,000" data-name="200 notes for 30,000">200 notes for 30,000- ₦65,000</label>
                    <label><input type="checkbox" value="₦105,000" data-name="200 notes for 50,000">200 notes for 50,000- ₦105,000</label>
                    <label><input type="checkbox" value="₦210,00" data-name="200 notes for 100,000">200 notes for 100,000- ₦210,000</label>
                </div>
                <div class="five">
                    <p><b>500 Naira Notes</b></p>
                    <label><input type="checkbox" value="₦20,000" data-name="500 notes for 10,000">500 notes for 10,000- ₦20,000</label>
                    <label><input type="checkbox" value="₦30,000" data-name="500 notes for 15,000">500 notes for 15,000- ₦30,000</label>
                    <label><input type="checkbox" value="₦35,000" data-name="500 notes for 20,000">500 notes for 20,000- ₦35,000 </label>
                    <label><input type="checkbox" value="₦45,000" data-name="500 notes for 25,000">500 notes for 25,000- ₦45,000</label>
                    <label><input type="checkbox" value="₦55,000" data-name="500 notes for 30,000">500 notes for 30,000- ₦55,000</label>
                    <label><input type="checkbox" value="₦60,000" data-name="500 notes for 35,000">500 notes for 35,000- ₦60,000</label>
                    <label><input type="checkbox" value="₦65,000" data-name="500 notes for 40,000">500 notes for 40,000- ₦65,000</label>
                    <label><input type="checkbox" value="₦75,000" data-name="500 notes for 45,000">500 notes for 45,000- ₦75,000 </label>
                    <label><input type="checkbox" value="₦85,000" data-name="500 notes for 50,000">500 notes for 50,000- ₦85,000</label>
                    <label><input type="checkbox" value="₦160,000" data-name="500 notes for 100,000">500 notes for 100,000- ₦160,000</label>
                    <label><input type="checkbox" value="₦227,000" data-name="500 notes for 150,000">500 notes for 150,000- ₦227,000</label>
                    <label><input type="checkbox" value="₦320,000" data-name="500 notes for 200,000">500 notes for 200,000- ₦320,000</label>
                </div>
                <div class="one ">
                    <p><b>1,000 Naira Notes</b></p>
                    <label><input type="checkbox" value="₦18,000" data-name="1,000 notes for 10,000">1,000 notes for 10,000- ₦18,000</label>
                    <label><input type="checkbox" value="₦30,000" data-name="1,000 notes for 20,000">1,000 notes for 20,000- ₦30,000</label>
                    <label><input type="checkbox" value="₦45,000" data-name="1,000 notes for 30,000">1,000 notes for 30,000- ₦45,000 </label>
                    <label><input type="checkbox" value="₦75,000" data-name="1,000 notes for 50,000">1,000 notes for 50,000- ₦75,000</label>
                    <label><input type="checkbox" value="₦145,000" data-name="1,000 notes for 50,000">1,000 notes for 50,000- ₦145,000</label>
                    <label><input type="checkbox" value="₦210,000" data-name="1,000 notes for 200,000">1,000 notes for 200,000- ₦290,000</label>
                </div>
            </div>
<div>
    <p>Total: ₦<span id="totalDisplay>0</span></p>
</div>

            <div class="acco">
                <h4>Pay To:</h4>
                <p>
                    <b>Bank:</b>Access Bank <br>
                    <b>Account Name:</b>C-max Baker <br>
                    <b>Account No:</b>123456789

                </p>
                <label>Upload Payment Receipt</label>
                <input type="file" id="receipt" accept="images/*,.pdf" required>
            </div>

            <button type="submit" class="submit-btn">Submit Order</button>

        </form>
    </section>
    <script src="script.js"></script>
</body>

</html>
