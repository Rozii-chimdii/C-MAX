<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Treats</title>
</head>

<body>
    <!-- MAIN TREAT SECTION -->
    <section class="items">

        <!-- SECTION HEADING -->
        <h1>TREAT SECTION</h1>
        <p class="subtitle">
            A curated collection of treats — photos & video
        </p>

        <!-- GALLERY CONTAINER -->
        <div class="items-gallery">

            <!-- PHOTO 1 -->
            <div class="items-card photo-one">
                <img src="cake.jpg" alt="Delicious dessert">
                <p>♧ PHOTO 1</p>
            </div>

            <!-- VIDEO CARD -->
            <div class="items-card video-card">
                <video src="sup.MP4" controls loop muted width="100"></video>

            </div>

            <!-- PHOTO 2 -->
            <div class="items-card photo-two">
                <img src="chops.jpg" alt="Freshly baked pastry">
                <p>♧ PHOTO 2</p>
            </div>

            <!-- PHOTO 3 -->
            <div class="items-card photo-three">
                <img src="drink.jpg" alt="Creamy dessert">
                <p>PHOTO 3</p>
            </div>

            <!-- PHOTO 4 -->
            <div class="items-card photo-four">
                <img src="chin.jpg" alt="Chocolate pastry">
                <p>PHOTO 4</p>
            </div>

        </div>

    </section>
</body>

</html>
